<!doctype html>
<html>
  <head>
    <script>
      window.addEventListener("message", async function (e) {
        if (!e.data || e.data.type !== "exec") return;
        console.log("received exec request", e);
        console.log(
          window.loopCancellers ? [...window.loopCancellers] : "penis"
        );
        for (const cancel of window.loopCancellers ?? []) {
          console.log("REQUEST CANCELLED");
          cancel();
        }
        window.loopCancellers = [];
        await import(e.data.src);
        window.parent.postMessage(
          {
            type: "exec-response",
            id: e.data.id,
          },
          "*"
        );
      });
    </script>
  </head>
  <body></body>
</html>
